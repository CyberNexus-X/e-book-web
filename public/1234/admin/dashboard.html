<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Admin</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="admin-nav">
    <div class="logo">💬 Test Chat Admin</div>
    <div class="links">
      <a href="dashboard.html" class="active">📊 Dashboard</a>
      <a href="users.html">👥 Users</a>
      <a href="statuses.html">📝 Statuses</a>
      <button onclick="adminLogout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <h2>Analytics Overview</h2>
    <div class="stats-grid">
      <div class="stat-card"><h3>Total Users</h3><span id="stat-users">0</span></div>
      <div class="stat-card"><h3>Active Statuses</h3><span id="stat-statuses">0</span></div>
      <div class="stat-card"><h3>Avg MSGs/User</h3><span id="stat-msgs">0</span></div>
    </div>
    
    <div class="charts">
      <div class="chart-container"><canvas id="usersChart"></canvas></div>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    if (!sessionStorage.getItem('admin_session')) window.location.href = 'index.html';
    loadDashboardStats();
  </script>
</body>
</html>
